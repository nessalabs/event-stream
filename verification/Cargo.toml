[package]
name = "event-stream-verification"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui-kit = "0.6"
event-stream = { path = "..", features = ["sqlite", "snapshots", "source-journal", "replication"] }
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
sha2 = "=0.10.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
