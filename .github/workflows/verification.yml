name: Verification workspace
"on":
  push:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/src/**'
      - 'verification/fixtures/**'
      - 'verification/Cargo.toml'
      - 'verification/Cargo.lock'
      - 'verification/evidence/home.json'
      - 'docs/adr/*/adr.md'
      - '.github/workflows/verification.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/src/**'
      - 'verification/fixtures/**'
      - 'verification/Cargo.toml'
      - 'verification/Cargo.lock'
      - 'verification/evidence/home.json'
      - 'docs/adr/*/adr.md'
      - '.github/workflows/verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Compile console and headless targets
        run: cargo +stable check --locked --manifest-path verification/Cargo.toml --all-targets
      - name: Test shared scenarios and Home evidence
        run: cargo +stable test --locked --manifest-path verification/Cargo.toml --lib
